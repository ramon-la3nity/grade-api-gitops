apiVersion: v1
kind: Namespace
metadata:
  name: web2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: web2
spec:
  selector:
    matchLabels:
      app: web2
  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
      - name: httpd
        image: httpd:2.4.53-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-server-service
  namespace: web2
spec:
  type: NodePort
  selector:
    app: web2
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30003
